# Let's Go sign-in: Keycloak's keycloak.v2 login with the Let's Go look (css/letsgo.css), for the Let's Go clients only
# (letsgo-native, letsgo-admin: keycloak_setup --login-theme letsgo). The artwork in resources/img is mounted from the
# dashboard's art folder (server/accounts/dashboard/collect_assets.py), never committed: Pokemon images (c) Nintendo,
# Creatures, GAME FREAK, The Pokemon Company.
parent=keycloak.v2
import=common/keycloak
# (?v=: Keycloak lets browsers cache theme files for 30 days under an unchanged URL, and keeps a gzip copy in the
# container: with every CSS change bump it and recreate the container, compose up -d --force-recreate keycloak)
styles=css/styles.css css/letsgo.css?v=3
darkMode=false
